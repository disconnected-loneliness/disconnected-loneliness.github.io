{% assign t = site.data.i18n[page.lang] %}
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-mark"><img src="{{ '/assets/img/logo/logo.svg' | relative_url }}" alt="Disconnected" width="153" height="20"></p>
    <p class="footer-text">{{ t.funding }} Grant ID: <a href="{{ site.grant_id }}">{{ site.grant_id }}</a></p>
    <div class="footer-logos">
      <img src="{{ '/assets/img/logos/tudelft.jpg' | relative_url }}" alt="TU Delft">
      <img src="{{ '/assets/img/logos/amsterdamumc.jpg' | relative_url }}" alt="Amsterdam UMC">
    </div>
  </div>
</footer>
