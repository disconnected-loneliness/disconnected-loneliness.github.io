<a class="card" href="{{ include.post.url | relative_url }}">
  <img src="{{ include.post.thumb | default: include.post.image | relative_url }}" alt="" loading="lazy">
  <span class="card-body">
    <span class="meta">{% include date.html date=include.post.date month_only=include.post.month_only %}</span>
    <span class="card-title">{{ include.post.title }}</span>
    <span class="card-text">{{ include.post.summary }}</span>
  </span>
</a>
